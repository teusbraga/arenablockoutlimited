<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e242b"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>
    <linearGradient id="favMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro com borda tática chanfrada -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="url(#favBg)" stroke="#475569" stroke-width="2"/>
  <rect x="5" y="5" width="54" height="54" rx="6" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Letra 'B' Estilizada com a Flecha Tática '->' do Arena Breakout -->
  <g transform="translate(10, 13)">
    <!-- Letra B -->
    <path d="M 4,0 L 20,0 C 27,0 31,3 31,8 C 31,12 29,15 25,16 C 30,17 33,21 33,27 C 33,33 28,38 20,38 L 4,38 Z
             M 12,9 L 12,14 L 19,14 C 21,14 22,13 22,11 C 22,9 21,9 19,9 Z
             M 12,23 L 12,29 L 20,29 C 22,29 24,28 24,26 C 24,24 22,23 20,23 Z"
          fill="url(#favMetal)" stroke="#090d12" stroke-width="1.2"/>

    <!-- Flecha icônica saindo para a direita -->
    <path d="M 23,2 L 33,2 L 33,-2 L 44,5 L 33,12 L 33,8 L 23,8 Z"
          fill="url(#favMetal)" stroke="#090d12" stroke-width="1"/>
  </g>

  <!-- Acento alaranjado tático militar no rodapé -->
  <rect x="14" y="54" width="36" height="2.5" rx="1" fill="#e8933a"/>
</svg>