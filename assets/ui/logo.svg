<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <defs>
    <!-- Gradiente Metálico Texturizado com Brilho Superior -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#edf2f7"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Gradiente para o Topo do Título "ARENA" -->
    <linearGradient id="arenaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Chanfro Superior Brilhante -->
    <linearGradient id="specularHalf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Sombra e Relevo Tático Forte -->
    <filter id="tacticalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <style>
    .sub-limited {
      font-family: 'Oswald', 'JetBrains Mono', 'Impact', 'Arial Black', sans-serif;
      font-weight: 700;
      letter-spacing: 0.62em;
    }
  </style>

  <g filter="url(#tacticalGlow)">
    <!-- =========================================================
         1. "ARENA" (Estilo Militar Chanfrado em Arco Sutil)
         ========================================================= -->
    <g transform="translate(420, 80)">
      <!-- Letra A -->
      <path d="M -130,8 L -114,-38 L -98,8 L -105,8 L -109,-3 L -119,-3 L -123,8 Z M -114,-24 L -110,-10 L -118,-10 Z" fill="url(#arenaGrad)" stroke="#0f172a" stroke-width="1.8"/>
      <!-- Letra R -->
      <path d="M -88,8 L -88,-38 L -66,-38 C -58,-38 -54,-34 -54,-26 C -54,-20 -58,-17 -65,-16 L -53,8 L -63,8 L -73,-14 L -80,-14 L -80,8 Z M -80,-22 L -67,-22 C -63,-22 -61,-24 -61,-27 C -61,-30 -63,-31 -67,-31 L -80,-31 Z" fill="url(#arenaGrad)" stroke="#0f172a" stroke-width="1.8"/>
      <!-- Letra E -->
      <path d="M -43,8 L -43,-38 L -16,-38 L -16,-29 L -34,-29 L -34,-18 L -18,-18 L -18,-9 L -34,-9 L -34,0 L -15,0 L -15,8 Z" fill="url(#arenaGrad)" stroke="#0f172a" stroke-width="1.8"/>
      <!-- Letra N -->
      <path d="M -4,8 L -4,-38 L 6,-38 L 22,-8 L 22,-38 L 31,-38 L 31,8 L 21,8 L 5,-21 L 5,8 Z" fill="url(#arenaGrad)" stroke="#0f172a" stroke-width="1.8"/>
      <!-- Letra A -->
      <path d="M 44,8 L 60,-38 L 76,8 L 69,8 L 65,-3 L 55,-3 L 51,8 Z M 60,-24 L 64,-10 L 56,-10 Z" fill="url(#arenaGrad)" stroke="#0f172a" stroke-width="1.8"/>
    </g>

    <!-- =========================================================
         2. "BLOCKOUT" + FLECHA TÁTICA NA LETRA T
         ========================================================= -->
    <g transform="translate(24, 118)">
      <!-- LETRA B -->
      <path d="M 50,0 L 94,0 C 108,0 116,6 116,16 C 116,23 111,28 103,31 C 113,34 118,40 118,52 C 118,64 108,72 94,72 L 50,72 Z
               M 68,16 L 68,26 L 91,26 C 96,26 99,23 99,21 C 99,18 96,16 91,16 Z
               M 68,42 L 68,56 L 92,56 C 97,56 100,53 100,49 C 100,45 97,42 92,42 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- LETRA L -->
      <path d="M 128,0 L 146,0 L 146,55 L 186,55 L 186,72 L 128,72 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- LETRA O -->
      <path d="M 198,0 L 252,0 C 265,0 272,9 272,22 L 272,50 C 272,63 265,72 252,72 L 198,72 C 185,72 178,63 178,50 L 178,22 C 178,9 185,0 198,0 Z
               M 198,18 C 196,18 196,20 196,23 L 196,49 C 196,52 196,54 198,54 L 252,54 C 254,54 254,52 254,49 L 254,23 C 254,20 254,18 252,18 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- LETRA C -->
      <path d="M 334,0 L 334,18 L 300,18 C 298,18 298,20 298,23 L 298,49 C 298,52 298,54 300,54 L 334,54 L 334,72 L 296,72 C 283,72 280,63 280,50 L 280,22 C 280,9 283,0 296,0 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- LETRA K -->
      <path d="M 346,0 L 364,0 L 364,28 L 396,0 L 420,0 L 383,34 L 422,72 L 398,72 L 364,39 L 364,72 L 346,72 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- LETRA O -->
      <path d="M 444,0 L 498,0 C 511,0 518,9 518,22 L 518,50 C 518,63 511,72 498,72 L 444,72 C 431,72 424,63 424,50 L 424,22 C 424,9 431,0 444,0 Z
               M 444,18 C 442,18 442,20 442,23 L 442,49 C 442,52 442,54 444,54 L 498,54 C 500,54 500,52 500,49 L 500,23 C 500,20 500,18 498,18 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- LETRA U -->
      <path d="M 530,0 L 548,0 L 548,50 C 548,53 549,54 552,54 L 582,54 C 585,54 586,53 586,50 L 586,0 L 604,0 L 604,50 C 604,63 597,72 584,72 L 550,72 C 537,72 530,63 530,50 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- LETRA T COM A FLECHA TÁTICA INTEGRADA EXTENDIDA (MARCA REGISTRADA DO ESTILO) -->
      <!-- Haste vertical perfeitamente posicionada e a barra que continua para a direita -->
      <path d="M 632,18 L 632,72 L 614,72 L 614,18 L 596,18 L 596,0 L 685,0 L 685,-8 L 730,9 L 685,26 L 685,18 Z"
            fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>

      <!-- Brilho no topo da flecha (Bevel Cut) -->
      <polygon points="685,-4 722,9 685,9" fill="url(#specularHalf)"/>
    </g>

    <!-- =========================================================
         3. "LIMITED" (Tipografia Tática com Amplo Tracking)
         ========================================================= -->
    <g transform="translate(420, 240)" text-anchor="middle">
      <text class="sub-limited" x="0" y="0" font-size="21" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2">LIMITED</text>
    </g>

    <!-- Linha tática de detalhe sob o título -->
    <rect x="260" y="248" width="320" height="2" fill="url(#metalGrad)" opacity="0.45"/>
  </g>
</svg>